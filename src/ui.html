lex;gap:18px;padding:8px 0 15px}.stats strong{display:block;font-size:19px}.error{color:#bd3f40}progress{width:100%;accent-color:#6d58df}input[type=color]{flex:0 0 50px;height:30px;width:50px;border:0;background:none}#selection{font-size:13px;font-weight:600}.muted{color:#7e8291}

</style><main><header><h1>DCMaster-gpt <span style="font-size:11px;font-weight:500;letter-spacing:0;color:#777c8b">v{{VERSION}}</span></h1><button id="open-import" type="button">导入图片</button></header><div id="selection" class="selection-line">等待选区…</div>
<dialog id="import-page" aria-labelledby="import-title"><div id="import-drop"><div class="modal-header"><h2 id="import-title">导入图片</h2><button id="back-home" type="button" aria-label="关闭导入弹窗">✕</button></div><p class="small">拖入图片或文件夹<br>原尺寸 · 保留名称，无后缀</p><label class="check" style="margin:0 0 16px"><input id="import-create-frames" type="checkbox" checked> 新建 Frame 承载图片</label><input id="import-files" type="file" accept=".png,.jpg,.jpeg,.webp" multiple hidden><input id="import-folder" type="file" webkitdirectory multiple hidden><button id="import-folder-button" type="button">选择文件夹</button> <button id="import-button" type="button">选择图片</button><div id="import-status" role="status" aria-live="polite" class="small" style="margin-top:8px">PNG / JPG / WebP · 含子文件夹 · 每批 ≤128 MB</div></div>
</dialog><section id="export-page"><div id="export-content"><form id="settings"><div class="card"><h2>导出格式</h2><div class="chips" id="formats"></div><h2 style="margin-top:20px">输出倍率</h2><div class="chips" id="scales"></div><input id="custom" type="text" placeholder="自定义倍率，如 0.5, 2.5（最高 16x）" aria-label="自定义倍率"></div>
<div class="card"><h2>压缩档位</h2><div class="chips" id="presets" role="radiogroup" aria-label="压缩档位">
<label class="chip"><input type="radio" name="preset" value="lossless" checked><span>无损</span></label><label class="chip"><input type="radio" name="preset" value="quality"><span>高清</span></label><label class="chip"><input type="radio" name="preset" value="balanced"><span>均衡</span></label><label class="chip"><input type="radio" name="preset" value="size"><span>极小</span></label></div><p hidden id="preset-description" class="small" style="margin:10px 0 0"></p><p hidden id="format-note" class="small" style="margin:6px 0 0"></p></div>
<div id="special" class="card"><h2>特殊选项</h2><label id="deep-option" class="check"><input id="deep" type="checkbox"> 深度优化 <span class="small">· 多试几种参数，耗时更长</span></label><div id="jpeg-options" hidden><div class="row" style="margin-top:12px"><label for="background">JPEG 背景色</label><input id="background" type="color" value="#ffffff" aria-label="JPEG 背景色"></div><div class="small">JPEG 不支持透明背景，透明区域使用此颜色。</div></div></div>
<div id="gif-options" class="card" hidden><h2>GIF 动画</h2><label for="gif-delay">每帧时长（毫秒）</label><input id="gif-delay" type="number" min="20" max="10000" step="10" value="200"><p class="small">选中对象按 Figma 选区顺序作为帧，循环播放。不同尺寸居中放入最大帧尺寸画布；GIF 最多 256 色。</p></div><div class="card"><h2>文件命名</h2><label><input id="named" type="checkbox" checked> 按所选对象名称命名</label></div></form>
<div class="card"><h2>压缩预览</h2><div id="summary"></div><progress id="progress" value="0" max="1" hidden></progress><div id="status" role="status" aria-live="polite">选择格式与倍率，开始预览。</div><div id="results"></div></div></div><div class="actions"><button id="preview" class="primary">计算压缩预览</button><button id="download" disabled>下载 ZIP</button><button id="cancel" hidden>取消</button></div></section></main><!--SCRIPT--></html>
